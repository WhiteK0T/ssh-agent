# Файл: .github/workflows/links.yml. Еженедельная проверка внешних ссылок документации.
name: Links

on:
  schedule:
    - cron: "37 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Внешние ссылки
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Подготовить lychee
        run: python3 tools/bootstrap.py lychee
      - name: Проверить документацию
        run: bash tools/check.sh links-online
